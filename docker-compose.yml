services:
  db:
    image: postgres:17-alpine
    container_name: nexveins-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexveins_finance}
      POSTGRES_USER: ${POSTGRES_USER:-nexveins}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexveins_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nexveins-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexveins} -d ${POSTGRES_DB:-nexveins_finance}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nexveins-pgdata:
